<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irregular Verbs Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .flip-card { background-color: transparent; perspective: 1000px; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; flex-direction: column; border-radius: 2.5rem; padding: 20px; }
        .flip-card-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const initialVerbsData = [
          { v1: 'be', v2: 'was, were', v3: 'been', translate: 'бути' },
          { v1: 'become', v2: 'became', v3: 'become', translate: 'ставати' },
          { v1: 'begin', v2: 'began', v3: 'begun', translate: 'починати' },
          { v1: 'break', v2: 'broke', v3: 'broken', translate: 'ламати' },
          { v1: 'bring', v2: 'brought', v3: 'brought', translate: 'приносити' },
          { v1: 'build', v2: 'built', v3: 'built', translate: 'будувати' },
          { v1: 'burn', v2: 'burnt / burned', v3: 'burnt / burned', translate: 'горіти, палити' },
          { v1: 'buy', v2: 'bought', v3: 'bought', translate: 'купувати' },
          { v1: 'catch', v2: 'caught', v3: 'caught', translate: 'ловити' },
          { v1: 'choose', v2: 'chose', v3: 'chosen', translate: 'вибирати' },
          { v1: 'come', v2: 'came', v3: 'come', translate: 'приходити' },
          { v1: 'cost', v2: 'cost', v3: 'cost', translate: 'коштувати' },
          { v1: 'cut', v2: 'cut', v3: 'cut', translate: 'різати' },
          { v1: 'do', v2: 'did', v3: 'done', translate: 'робити' },
          { v1: 'draw', v2: 'drew', v3: 'drawn', translate: 'малювати, тягти' },
          { v1: 'dream', v2: 'dreamed / dreamt', v3: 'dreamed / dreamt', translate: 'мріяти, снитися' },
          { v1: 'drink', v2: 'drank', v3: 'drunk', translate: 'пити' },
          { v1: 'drive', v2: 'drove', v3: 'driven', translate: 'водити (авто)' },
          { v1: 'eat', v2: 'ate', v3: 'eaten', translate: 'їсти' },
          { v1: 'fall', v2: 'fell', v3: 'fallen', translate: 'падати, опадати' },
          { v1: 'find', v2: 'found', v3: 'found', translate: 'знаходити' },
          { v1: 'fly', v2: 'flew', v3: 'flown', translate: 'літати' },
          { v1: 'forget', v2: 'forgot', v3: 'forgotten', translate: 'забувати' },
          { v1: 'get', v2: 'got', v3: 'got', translate: 'отримувати, ставати' },
          { v1: 'give', v2: 'gave', v3: 'given', translate: 'давати' },
          { v1: 'go', v2: 'went', v3: 'gone / been', translate: 'йти, їхати' },
          { v1: 'grow', v2: 'grew', v3: 'grown', translate: 'рости, вирощувати' },
          { v1: 'have', v2: 'had', v3: 'had', translate: 'мати' },
          { v1: 'hear', v2: 'heard', v3: 'heard', translate: 'чути' },
          { v1: 'hit', v2: 'hit', v3: 'hit', translate: 'вдаряти, влучати' },
          { v1: 'hold', v2: 'held', v3: 'held', translate: 'тримати' },
          { v1: 'hurt', v2: 'hurt', v3: 'hurt', translate: 'боліти, завдавати болю' },
          { v1: 'keep', v2: 'kept', v3: 'kept', translate: 'тримати, зберігати' },
          { v1: 'know', v2: 'knew', v3: 'known', translate: 'знати' },
          { v1: 'learn', v2: 'learned / learnt', v3: 'learned / learnt', translate: 'вчити(ся)' },
          { v1: 'leave', v2: 'left', v3: 'left', translate: 'залишати, покидати' },
          { v1: 'lend', v2: 'lent', v3: 'lent', translate: 'позичати' },
          { v1: 'lie', v2: 'lay', v3: 'lain', translate: 'лежати' },
          { v1: 'lose', v2: 'lost', v3: 'lost', translate: 'втрачати' },
          { v1: 'make', v2: 'made', v3: 'made', translate: 'робити' }
        ];

        function App() {
            const [mode, setMode] = useState('menu');
            const [bestScore, setBestScore] = useState(0);
            const [totalSessions, setTotalSessions] = useState(0);
            const [currentVerbs, setCurrentVerbs] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [score, setScore] = useState(0);
            const [feedback, setFeedback] = useState(null);
            const [quizFinished, setQuizFinished] = useState(false);
            const [timeLeft, setTimeLeft] = useState(60);
            const [sprintPair, setSprintPair] = useState({ verb: null, shownForms: '', isCorrect: false });
            const [options, setOptions] = useState([]);
            const [inputV2, setInputV2] = useState('');
            const [inputV3, setInputV3] = useState('');
            const timerRef = useRef(null);

            useEffect(() => {
                setBestScore(parseInt(localStorage.getItem('bestScore')) || 0);
                setTotalSessions(parseInt(localStorage.getItem('totalSessions')) || 0);
            }, []);

            const updateStats = (s) => {
                const b = Math.max(bestScore, s);
                const t = totalSessions + 1;
                setBestScore(b); setTotalSessions(t);
                localStorage.setItem('bestScore', b); localStorage.setItem('totalSessions', t);
            };

            const speak = (t) => {
                const u = new SpeechSynthesisUtterance(t);
                u.lang = 'en-US'; window.speechSynthesis.speak(u);
            };

            const shuffle = (a) => [...a].sort(() => Math.random() - 0.5);

            const resetToMenu = () => {
                clearInterval(timerRef.current);
                setMode('menu'); setQuizFinished(false); setFeedback(null);
            };

            // --- Handlers ---
            const startFlashcards = () => {
                setCurrentVerbs(shuffle(initialVerbsData));
                setCurrentIndex(0); setIsFlipped(false); setMode('flashcards');
            };

            const startSprint = () => {
                setScore(0); setTimeLeft(60); setQuizFinished(false); setMode('sprint');
                genSprint();
                timerRef.current = setInterval(() => setTimeLeft(p => p <= 1 ? (clearInterval(timerRef.current), 0) : p - 1), 1000);
            };

            const genSprint = () => {
                const v = initialVerbsData[Math.floor(Math.random()*initialVerbsData.length)];
                const ok = Math.random() > 0.5;
                const shown = ok ? `${v.v2} — ${v.v3}` : (() => {
                    const o = initialVerbsData[Math.floor(Math.random()*initialVerbsData.length)];
                    return `${o.v2} — ${o.v3}`;
                })();
                setSprintPair({ verb: v, shownForms: shown, isCorrect: ok });
            };

            const handleSprint = (a) => {
                if(a === sprintPair.isCorrect) { setScore(s=>s+1); setFeedback('correct'); } else setFeedback('wrong');
                setTimeout(() => { setFeedback(null); if(timeLeft > 0) genSprint(); else { setQuizFinished(true); updateStats(score); } }, 200);
            };

            return (
                <div className={`min-h-screen p-4 flex flex-col items-center transition-all ${feedback === 'correct' ? 'bg-green-500' : feedback === 'wrong' ? 'bg-red-500' : 'bg-slate-50'}`}>
                    <div className="w-full max-w-xl mt-6">
                        
                        <header className="flex justify-between items-center mb-8">
                           <div onClick={resetToMenu} className="cursor-pointer">
                              <h1 className={`text-2xl font-black ${feedback ? 'text-white' : 'text-slate-900'}`}>Verbs Trainer</h1>
                              <p className={`text-[10px] font-bold uppercase tracking-widest ${feedback ? 'text-white/60' : 'text-slate-400'}`}>Eighth Grade Edition</p>
                           </div>
                           <div className="bg-white/20 backdrop-blur-md px-4 py-2 rounded-2xl border border-white/30 text-white font-bold text-sm flex items-center gap-2 shadow-sm">
                                <i className="fa-solid fa-trophy text-yellow-300"></i> {bestScore}
                           </div>
                        </header>

                        {mode === 'menu' && (
                          <div className="grid grid-cols-1 gap-4 animate-in fade-in zoom-in duration-300">
                             <div className="bg-indigo-600 text-white rounded-[2.5rem] p-8 shadow-xl relative overflow-hidden group">
                                <div className="relative z-10">
                                   <span className="text-[10px] font-black uppercase tracking-widest bg-black/20 px-3 py-1 rounded-full">Учить</span>
                                   <h2 className="text-4xl font-black mt-4 mb-6">Готов к тесту?</h2>
                                   <button onClick={startFlashcards} className="bg-white text-indigo-600 px-8 py-4 rounded-2xl font-black text-sm hover:scale-105 transition shadow-lg">НАЧАТЬ КАРТОЧКИ</button>
                                </div>
                                <i className="fa-solid fa-graduation-cap absolute -right-4 -bottom-4 text-9xl opacity-10 group-hover:rotate-12 transition-transform"></i>
                             </div>
                             <div className="grid grid-cols-2 gap-4">
                                <MenuBtn icon="fa-clone" color="text-blue-500" label="Карточки" sub="Перевод -> Формы" onClick={startFlashcards} />
                                <MenuBtn icon="fa-bolt" color="text-orange-500" label="Спринт" sub="Да / Нет" onClick={startSprint} />
                             </div>
                          </div>
                        )}

                        {mode === 'flashcards' && (
                            <div className="space-y-6 text-center animate-in slide-in-from-right duration-300">
                                <div className="flex justify-between items-center bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                                    <button onClick={resetToMenu} className="w-10 h-10 flex items-center justify-center hover:bg-slate-50 rounded-full"><i className="fa-solid fa-house text-slate-400"></i></button>
                                    <span className="font-black text-slate-400 tracking-tighter">{currentIndex + 1} / {currentVerbs.length}</span>
                                    <div className="w-10"></div>
                                </div>

                                <div className={`flip-card w-full h-96 ${isFlipped ? 'flipped' : ''}`} onClick={() => setIsFlipped(!isFlipped)}>
                                    <div className="flip-card-inner">
                                        {/* ЛИЦЕВАЯ СТОРОНА: ПЕРЕВОД */}
                                        <div className="flip-card-front bg-white shadow-2xl border-b-[12px] border-indigo-50">
                                            <span className="text-[10px] font-black text-indigo-400 uppercase tracking-[0.2em] mb-4">Перевод</span>
                                            <h3 className="text-5xl font-black text-slate-800 leading-tight">{currentVerbs[currentIndex].translate}</h3>
                                            <div className="mt-12 w-12 h-1 bg-slate-100 rounded-full"></div>
                                            <p className="text-slate-300 mt-6 font-bold text-[10px] uppercase tracking-widest">Нажми, чтобы увидеть формы</p>
                                        </div>
                                        {/* ОБРАТНАЯ СТОРОНА: 3 ФОРМЫ */}
                                        <div className="flip-card-back bg-indigo-600 text-white shadow-2xl overflow-hidden relative">
                                            <div className="relative z-10">
                                                <div className="space-y-1 mb-8">
                                                    <p className="text-sm font-black text-white/50 uppercase tracking-widest italic">V1 V2 V3</p>
                                                    <h3 className="text-4xl font-black">{currentVerbs[currentIndex].v1}</h3>
                                                    <h3 className="text-4xl font-black">{currentVerbs[currentIndex].v2}</h3>
                                                    <h3 className="text-4xl font-black">{currentVerbs[currentIndex].v3}</h3>
                                                </div>
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); speak(currentVerbs[currentIndex].v1); }} 
                                                    className="w-16 h-16 bg-white/10 hover:bg-white/20 rounded-full border border-white/20 transition-all flex items-center justify-center mx-auto"
                                                >
                                                    <i className="fa-solid fa-volume-high text-2xl"></i>
                                                </button>
                                            </div>
                                            <i className="fa-solid fa-language absolute -bottom-10 -left-10 text-[15rem] opacity-5 rotate-12"></i>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex gap-4">
                                    <button className="flex-1 bg-white border-2 border-slate-200 text-slate-400 h-16 rounded-2xl font-black hover:bg-slate-50 transition" onClick={() => { setIsFlipped(false); setCurrentIndex(p => Math.max(0, p-1)) }}>НАЗАД</button>
                                    <button className="flex-1 bg-slate-900 text-white h-16 rounded-2xl font-black shadow-xl hover:bg-slate-800 transition" onClick={() => { setIsFlipped(false); setCurrentIndex(p => Math.min(currentVerbs.length-1, p+1)) }}>ДАЛЕЕ</button>
                                </div>
                            </div>
                        )}

                        {mode === 'sprint' && !quizFinished && (
                            <div className="space-y-6 text-center animate-in zoom-in duration-300">
                                <div className="flex justify-between items-center bg-white p-4 rounded-3xl shadow-sm">
                                    <div className="text-orange-500 font-black text-2xl"><i className="fa-solid fa-bolt"></i> {timeLeft}s</div>
                                    <div className="font-black text-slate-800 text-xl">Score: {score}</div>
                                </div>
                                <div className="bg-white p-12 rounded-[3rem] shadow-2xl border-b-8 border-orange-100">
                                    <h3 className="text-5xl font-black text-slate-800 mb-4">{sprintPair.verb?.translate}</h3>
                                    <p className="text-3xl font-black text-indigo-600 bg-indigo-50 py-6 rounded-3xl">{sprintPair.shownForms}</p>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <button onClick={() => handleSprint(false)} className="h-24 rounded-[2rem] bg-red-500 text-white text-4xl shadow-lg hover:bg-red-600"><i className="fa-solid fa-xmark"></i></button>
                                    <button onClick={() => handleSprint(true)} className="h-24 rounded-[2rem] bg-green-500 text-white text-4xl shadow-lg hover:bg-green-600"><i className="fa-solid fa-check"></i></button>
                                </div>
                            </div>
                        )}

                        {quizFinished && (
                           <div className="p-12 text-center rounded-[3rem] shadow-2xl bg-white border-t-8 border-green-400 animate-in zoom-in duration-500">
                              <i className="fa-solid fa-circle-check text-green-500 text-8xl mb-6"></i>
                              <h2 className="text-4xl font-black text-slate-800">ГОТОВО!</h2>
                              <div className="text-9xl font-black text-slate-900 my-10">{score}</div>
                              <button onClick={resetToMenu} className="w-full h-16 rounded-2xl bg-indigo-600 text-white font-black text-xl shadow-lg">В МЕНЮ</button>
                           </div>
                        )}
                    </div>
                </div>
            );
        }

        const MenuBtn = ({ icon, color, label, sub, onClick }) => (
            <div onClick={onClick} className="bg-white p-6 rounded-[2rem] shadow-sm hover:shadow-xl cursor-pointer transition-all border-2 border-transparent hover:border-slate-100 group">
                <i className={`fa-solid ${icon} ${color} text-3xl mb-3 group-hover:scale-110 transition-transform`}></i>
                <h4 className="font-black text-slate-800 text-sm uppercase leading-none">{label}</h4>
                <p className="text-[10px] text-slate-400 font-bold mt-1 uppercase tracking-tighter">{sub}</p>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
