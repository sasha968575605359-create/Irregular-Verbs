<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irregular Verbs Trainer Full</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .flip-card { background-color: transparent; perspective: 1000px; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; flex-direction: column; border-radius: 2rem; }
        .flip-card-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-50 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const initialVerbsData = [
          { v1: 'be', v2: 'was, were', v3: 'been', translate: 'бути' },
          { v1: 'become', v2: 'became', v3: 'become', translate: 'ставати' },
          { v1: 'begin', v2: 'began', v3: 'begun', translate: 'починати' },
          { v1: 'break', v2: 'broke', v3: 'broken', translate: 'ламати' },
          { v1: 'bring', v2: 'brought', v3: 'brought', translate: 'приносити' },
          { v1: 'build', v2: 'built', v3: 'built', translate: 'будувати' },
          { v1: 'burn', v2: 'burnt / burned', v3: 'burnt / burned', translate: 'горіти, палити' },
          { v1: 'buy', v2: 'bought', v3: 'bought', translate: 'купувати' },
          { v1: 'catch', v2: 'caught', v3: 'caught', translate: 'ловити' },
          { v1: 'choose', v2: 'chose', v3: 'chosen', translate: 'вибирати' },
          { v1: 'come', v2: 'came', v3: 'come', translate: 'приходити' },
          { v1: 'cost', v2: 'cost', v3: 'cost', translate: 'коштувати' },
          { v1: 'cut', v2: 'cut', v3: 'cut', translate: 'різати' },
          { v1: 'do', v2: 'did', v3: 'done', translate: 'робити' },
          { v1: 'draw', v2: 'drew', v3: 'drawn', translate: 'малювати, тягти' },
          { v1: 'dream', v2: 'dreamed / dreamt', v3: 'dreamed / dreamt', translate: 'мріяти, снитися' },
          { v1: 'drink', v2: 'drank', v3: 'drunk', translate: 'пити' },
          { v1: 'drive', v2: 'drove', v3: 'driven', translate: 'водити (авто)' },
          { v1: 'eat', v2: 'ate', v3: 'eaten', translate: 'їсти' },
          { v1: 'fall', v2: 'fell', v3: 'fallen', translate: 'падати, опадати' },
          { v1: 'find', v2: 'found', v3: 'found', translate: 'знаходити' },
          { v1: 'fly', v2: 'flew', v3: 'flown', translate: 'літати' },
          { v1: 'forget', v2: 'forgot', v3: 'forgotten', translate: 'забувати' },
          { v1: 'get', v2: 'got', v3: 'got', translate: 'отримувати, ставати' },
          { v1: 'give', v2: 'gave', v3: 'given', translate: 'давати' },
          { v1: 'go', v2: 'went', v3: 'gone / been', translate: 'йти, їхати' },
          { v1: 'grow', v2: 'grew', v3: 'grown', translate: 'рости, вирощувати' },
          { v1: 'have', v2: 'had', v3: 'had', translate: 'мати' },
          { v1: 'hear', v2: 'heard', v3: 'heard', translate: 'чути' },
          { v1: 'hit', v2: 'hit', v3: 'hit', translate: 'вдаряти, влучати' },
          { v1: 'hold', v2: 'held', v3: 'held', translate: 'тримати' },
          { v1: 'hurt', v2: 'hurt', v3: 'hurt', translate: 'боліти, завдавати болю' },
          { v1: 'keep', v2: 'kept', v3: 'kept', translate: 'тримати, зберігати' },
          { v1: 'know', v2: 'knew', v3: 'known', translate: 'знати' },
          { v1: 'learn', v2: 'learned / learnt', v3: 'learned / learnt', translate: 'вчити(ся)' },
          { v1: 'leave', v2: 'left', v3: 'left', translate: 'залишати, покидати' },
          { v1: 'lend', v2: 'lent', v3: 'lent', translate: 'позичати' },
          { v1: 'lie', v2: 'lay', v3: 'lain', translate: 'лежати' },
          { v1: 'lose', v2: 'lost', v3: 'lost', translate: 'втрачати' },
          { v1: 'make', v2: 'made', v3: 'made', translate: 'робити' }
        ];

        function App() {
            const [mode, setMode] = useState('menu');
            const [bestScore, setBestScore] = useState(0);
            const [totalSessions, setTotalSessions] = useState(0);
            
            // Состояния для игр
            const [currentVerbs, setCurrentVerbs] = useState([...initialVerbsData]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [feedback, setFeedback] = useState(null);
            const [isFlipped, setIsFlipped] = useState(false);
            const [quizFinished, setQuizFinished] = useState(false);
            
            // Для Спринта
            const [timeLeft, setTimeLeft] = useState(60);
            const [sprintPair, setSprintPair] = useState({ verb: null, shownForms: '', isCorrect: false });
            const timerRef = useRef(null);

            // Для Выбора (Multiple Choice)
            const [options, setOptions] = useState([]);

            // Для Письма (Quiz)
            const [inputV2, setInputV2] = useState('');
            const [inputV3, setInputV3] = useState('');

            useEffect(() => {
                const savedBest = localStorage.getItem('bestScore');
                const savedSessions = localStorage.getItem('totalSessions');
                if (savedBest) setBestScore(parseInt(savedBest));
                if (savedSessions) setTotalSessions(parseInt(savedSessions));
            }, []);

            const updateStats = (newScore) => {
                const newBest = Math.max(bestScore, newScore);
                setBestScore(newBest);
                const newSessions = totalSessions + 1;
                setTotalSessions(newSessions);
                localStorage.setItem('bestScore', newBest);
                localStorage.setItem('totalSessions', newSessions);
            };

            const speak = (text) => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            };

            const shuffle = (array) => [...array].sort(() => Math.random() - 0.5);

            // --- Инициализация режимов ---
            const startFlashcards = () => {
                setCurrentVerbs(shuffle(initialVerbsData));
                setCurrentIndex(0);
                setIsFlipped(false);
                setMode('flashcards');
            };

            const startSprint = () => {
                setScore(0);
                setTimeLeft(60);
                setQuizFinished(false);
                setMode('sprint');
                nextSprintStep();
                timerRef.current = setInterval(() => {
                    setTimeLeft((p) => (p <= 1 ? (clearInterval(timerRef.current), 0) : p - 1));
                }, 1000);
            };

            const startMultipleChoice = () => {
                const shuffled = shuffle(initialVerbsData);
                setCurrentVerbs(shuffled);
                setCurrentIndex(0);
                setScore(0);
                setQuizFinished(false);
                setMode('multiple-choice');
                generateOptions(shuffled[0]);
            };

            const startQuiz = () => {
                setCurrentVerbs(shuffle(initialVerbsData));
                setCurrentIndex(0);
                setScore(0);
                setQuizFinished(false);
                setInputV2('');
                setInputV3('');
                setMode('quiz');
            };

            // --- Логика Спринта ---
            const nextSprintStep = () => {
                const randomVerb = initialVerbsData[Math.floor(Math.random() * initialVerbsData.length)];
                const isCorrect = Math.random() > 0.5;
                let shown;
                if (isCorrect) {
                    shown = `${randomVerb.v2} — ${randomVerb.v3}`;
                } else {
                    const other = initialVerbsData[Math.floor(Math.random() * initialVerbsData.length)];
                    shown = `${other.v2} — ${other.v3}`;
                }
                setSprintPair({ verb: randomVerb, shownForms: shown, isCorrect });
            };

            const handleSprintAnswer = (ans) => {
                if (ans === sprintPair.isCorrect) {
                    setScore(s => s + 1);
                    setFeedback('correct');
                } else setFeedback('wrong');
                setTimeout(() => {
                    setFeedback(null);
                    if (timeLeft > 0) nextSprintStep();
                    else { setQuizFinished(true); updateStats(score); }
                }, 200);
            };

            // --- Логика Выбора ---
            const generateOptions = (correctVerb) => {
                const correctStr = `${correctVerb.v2}, ${correctVerb.v3}`;
                let others = initialVerbsData
                    .filter(v => v.v1 !== correctVerb.v1)
                    .map(v => `${v.v2}, ${v.v3}`);
                const pickedOthers = shuffle(others).slice(0, 3);
                setOptions(shuffle([correctStr, ...pickedOthers]));
            };

            const handleChoice = (option) => {
                const correct = `${currentVerbs[currentIndex].v2}, ${currentVerbs[currentIndex].v3}`;
                if (option === correct) {
                    setScore(s => s + 1);
                    setFeedback('correct');
                } else setFeedback('wrong');

                setTimeout(() => {
                    setFeedback(null);
                    if (currentIndex < 19) {
                        setCurrentIndex(currentIndex + 1);
                        generateOptions(currentVerbs[currentIndex + 1]);
                    } else {
                        setQuizFinished(true);
                        updateStats(score + (option === correct ? 1 : 0));
                    }
                }, 400);
            };

            // --- Логика Письма ---
            const handleQuizSubmit = () => {
                const verb = currentVerbs[currentIndex];
                // Очистка от пробелов и приведение к нижнему регистру
                const clean = (s) => s.toLowerCase().trim();
                const isV2Correct = verb.v2.split('/').some(v => clean(v) === clean(inputV2));
                const isV3Correct = verb.v3.split('/').some(v => clean(v) === clean(inputV3));

                if (isV2Correct && isV3Correct) {
                    setScore(s => s + 1);
                    setFeedback('correct');
                } else setFeedback('wrong');

                setTimeout(() => {
                    setFeedback(null);
                    setInputV2('');
                    setInputV3('');
                    if (currentIndex < 19) {
                        setCurrentIndex(currentIndex + 1);
                    } else {
                        setQuizFinished(true);
                        updateStats(score + (isV2Correct && isV3Correct ? 1 : 0));
                    }
                }, 600);
            };

            const resetToMenu = () => {
                clearInterval(timerRef.current);
                setMode('menu');
                setQuizFinished(false);
                setFeedback(null);
            };

            return (
                <div className={`min-h-screen p-4 flex flex-col items-center transition-all ${feedback === 'correct' ? 'bg-green-500' : feedback === 'wrong' ? 'bg-red-500' : 'bg-slate-50'}`}>
                    <div className="w-full max-w-xl mt-6">
                        
                        {/* Header */}
                        <header className="flex justify-between items-center mb-8">
                           <div onClick={resetToMenu} className="cursor-pointer">
                              <h1 className={`text-2xl font-black ${feedback ? 'text-white' : 'text-slate-900'}`}>Irregular Verbs</h1>
                              <p className={`text-[10px] font-bold uppercase tracking-widest ${feedback ? 'text-white/60' : 'text-slate-400'}`}>Full Trainer App</p>
                           </div>
                           <div className="bg-white/20 backdrop-blur-md px-4 py-2 rounded-2xl border border-white/30 text-white font-bold text-sm flex items-center gap-2">
                                <i className="fa-solid fa-trophy text-yellow-300"></i> {bestScore}
                           </div>
                        </header>

                        {/* MENU */}
                        {mode === 'menu' && (
                          <div className="grid grid-cols-1 gap-4 animate-in fade-in zoom-in duration-300">
                             <div className="bg-indigo-600 text-white rounded-[2.5rem] p-8 shadow-xl relative overflow-hidden group">
                                <div className="relative z-10">
                                   <span className="text-[10px] font-black uppercase tracking-widest bg-black/20 px-3 py-1 rounded-full">Слово дня</span>
                                   <h2 className="text-5xl font-black mt-4 mb-1">{initialVerbsData[0].v1}</h2>
                                   <p className="opacity-70 italic mb-6">{initialVerbsData[0].translate}</p>
                                   <button onClick={startFlashcards} className="bg-white text-indigo-600 px-6 py-3 rounded-2xl font-black text-sm hover:scale-105 transition">УЧИТЬ СЕЙЧАС</button>
                                </div>
                                <i className="fa-solid fa-brain absolute -right-4 -bottom-4 text-9xl opacity-10 group-hover:rotate-12 transition-transform"></i>
                             </div>

                             <div className="grid grid-cols-2 gap-4">
                                <MenuBtn icon="fa-clone" color="text-blue-500" label="Карточки" sub="Заучивание" onClick={startFlashcards} />
                                <MenuBtn icon="fa-bolt" color="text-orange-500" label="Спринт" sub="На время" onClick={startSprint} />
                                <MenuBtn icon="fa-list-ul" color="text-purple-500" label="Выбор" sub="Тест 20 слов" onClick={startMultipleChoice} />
                                <MenuBtn icon="fa-pen-clip" color="text-green-500" label="Письмо" sub="Профи" onClick={startQuiz} />
                             </div>
                          </div>
                        )}

                        {/* FLASHCARDS */}
                        {mode === 'flashcards' && (
                            <div className="space-y-6 text-center animate-in slide-in-from-right duration-300">
                                <div className="flex justify-between items-center bg-white p-4 rounded-3xl shadow-sm">
                                    <button onClick={resetToMenu}><i className="fa-solid fa-house"></i></button>
                                    <span className="font-black text-slate-400">{currentIndex + 1} / {currentVerbs.length}</span>
                                    <button onClick={() => speak(currentVerbs[currentIndex].v1)}><i className="fa-solid fa-volume-high"></i></button>
                                </div>
                                <div className={`flip-card w-full h-80 ${isFlipped ? 'flipped' : ''}`} onClick={() => setIsFlipped(!isFlipped)}>
                                    <div className="flip-card-inner">
                                        <div className="flip-card-front bg-white shadow-xl border-b-8 border-indigo-100">
                                            <h3 className="text-6xl font-black text-slate-800">{currentVerbs[currentIndex].v1}</h3>
                                            <p className="text-slate-400 mt-4 uppercase tracking-widest font-bold text-xs">Нажми, чтобы перевернуть</p>
                                        </div>
                                        <div className="flip-card-back bg-indigo-600 text-white shadow-xl">
                                            <p className="text-3xl font-black mb-2">{currentVerbs[currentIndex].v2}</p>
                                            <p className="text-3xl font-black mb-6">{currentVerbs[currentIndex].v3}</p>
                                            <div className="h-px w-12 bg-white/30 mb-6"></div>
                                            <p className="text-xl font-medium opacity-90">{currentVerbs[currentIndex].translate}</p>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex gap-4">
                                    <button className="flex-1 bg-slate-200 h-16 rounded-2xl font-bold" onClick={() => { setIsFlipped(false); setCurrentIndex(p => Math.max(0, p-1)) }}>Назад</button>
                                    <button className="flex-1 bg-slate-900 text-white h-16 rounded-2xl font-bold" onClick={() => { setIsFlipped(false); setCurrentIndex(p => Math.min(currentVerbs.length-1, p+1)) }}>Далее</button>
                                </div>
                            </div>
                        )}

                        {/* MULTIPLE CHOICE */}
                        {mode === 'multiple-choice' && !quizFinished && (
                            <div className="space-y-6 animate-in fade-in duration-300">
                                <div className="bg-white p-6 rounded-[2.5rem] shadow-xl text-center border-b-8 border-purple-100">
                                    <span className="text-purple-500 font-black text-xs uppercase tracking-widest">Как переводятся формы V2 и V3?</span>
                                    <h2 className="text-5xl font-black text-slate-800 my-4">{currentVerbs[currentIndex].v1}</h2>
                                    <p className="text-slate-400 font-medium italic">{currentVerbs[currentIndex].translate}</p>
                                </div>
                                <div className="grid grid-cols-1 gap-3">
                                    {options.map((opt, i) => (
                                        <button key={i} onClick={() => handleChoice(opt)} className="bg-white p-6 rounded-2xl font-bold text-slate-700 shadow-sm hover:shadow-md hover:bg-slate-50 transition text-left flex justify-between items-center group">
                                            {opt}
                                            <i className="fa-solid fa-chevron-right opacity-0 group-hover:opacity-100 transition"></i>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* SPRINT */}
                        {mode === 'sprint' && !quizFinished && (
                            <div className="space-y-6 text-center animate-in zoom-in duration-300">
                                <div className="flex justify-between items-center bg-white p-4 rounded-3xl shadow-sm">
                                    <div className="text-orange-500 font-black text-2xl"><i className="fa-solid fa-bolt"></i> {timeLeft}s</div>
                                    <div className="font-black text-slate-800 text-xl">Счёт: {score}</div>
                                </div>
                                <div className="bg-white p-12 rounded-[3rem] shadow-2xl border-b-8 border-orange-100">
                                    <h3 className="text-5xl font-black text-slate-800 mb-4">{sprintPair.verb?.v1}</h3>
                                    <p className="text-slate-400 mb-8 italic">{sprintPair.verb?.translate}</p>
                                    <p className="text-3xl font-black text-indigo-600 bg-indigo-50 py-4 rounded-2xl">{sprintPair.shownForms}</p>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <button onClick={() => handleSprintAnswer(false)} className="h-24 rounded-[2rem] bg-red-500 text-white text-4xl shadow-lg"><i className="fa-solid fa-xmark"></i></button>
                                    <button onClick={() => handleSprintAnswer(true)} className="h-24 rounded-[2rem] bg-green-500 text-white text-4xl shadow-lg"><i className="fa-solid fa-check"></i></button>
                                </div>
                            </div>
                        )}

                        {/* QUIZ (WRITING) */}
                        {mode === 'quiz' && !quizFinished && (
                            <div className="space-y-4 animate-in slide-in-from-bottom duration-300">
                                <div className="bg-white p-8 rounded-[2.5rem] shadow-xl text-center">
                                    <h2 className="text-5xl font-black text-slate-800 mb-2">{currentVerbs[currentIndex].v1}</h2>
                                    <p className="text-slate-400 italic">{currentVerbs[currentIndex].translate}</p>
                                </div>
                                <div className="space-y-3">
                                    <input value={inputV2} onChange={e => setInputV2(e.target.value)} placeholder="Вторая форма (V2)" className="w-full h-16 px-6 rounded-2xl border-2 border-slate-100 focus:border-indigo-500 outline-none font-bold text-lg transition" />
                                    <input value={inputV3} onChange={e => setInputV3(e.target.value)} placeholder="Третья форма (V3)" className="w-full h-16 px-6 rounded-2xl border-2 border-slate-100 focus:border-indigo-500 outline-none font-bold text-lg transition" />
                                    <button onClick={handleQuizSubmit} className="w-full h-16 bg-slate-900 text-white rounded-2xl font-black text-xl">ПРОВЕРИТЬ</button>
                                </div>
                                <p className="text-center text-slate-400 font-bold text-xs uppercase tracking-widest mt-4">Слово {currentIndex+1} из 20</p>
                            </div>
                        )}

                        {/* FINISH SCREEN */}
                        {quizFinished && (
                           <div className="p-12 text-center rounded-[3rem] shadow-2xl bg-white border-t-8 border-green-400 animate-in zoom-in duration-500">
                              <i className="fa-solid fa-circle-check text-green-500 text-8xl mb-6"></i>
                              <h2 className="text-4xl font-black text-slate-800 mb-2">ОТЛИЧНО!</h2>
                              <p className="text-slate-400 font-bold uppercase tracking-widest text-xs mb-8">Твой результат в режиме {mode}</p>
                              <div className="text-9xl font-black text-slate-900 mb-10">{score}</div>
                              <button onClick={resetToMenu} className="w-full h-16 rounded-2xl bg-indigo-600 text-white font-black text-xl hover:bg-indigo-700 transition shadow-lg shadow-indigo-200">В МЕНЮ</button>
                           </div>
                        )}

                    </div>
                </div>
            );
        }

        const MenuBtn = ({ icon, color, label, sub, onClick }) => (
            <div onClick={onClick} className="bg-white p-6 rounded-[2rem] shadow-sm hover:shadow-xl cursor-pointer transition-all border-2 border-transparent hover:border-slate-100 group">
                <i className={`fa-solid ${icon} ${color} text-3xl mb-3 group-hover:scale-110 transition-transform`}></i>
                <h4 className="font-black text-slate-800 text-sm uppercase leading-none">{label}</h4>
                <p className="text-[10px] text-slate-400 font-bold mt-1 uppercase tracking-tighter">{sub}</p>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
