<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irregular Verbs Pro Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap');
        body { font-family: 'Manrope', sans-serif; overflow-x: hidden; }
        .flip-card { perspective: 1000px; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; cursor: pointer; }
        .flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 2rem; display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 2rem; }
        .flip-card-back { transform: rotateY(180deg); }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .letter-btn:disabled { opacity: 0.3; cursor: not-allowed; text-decoration: line-through; }
        .hangman-svg { width: 120px; height: 150px; }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const VERBS = [
            { v1: 'be', v2: 'was, were', v3: 'been', translate: 'бути' },
            { v1: 'become', v2: 'became', v3: 'become', translate: 'ставати' },
            { v1: 'begin', v2: 'began', v3: 'begun', translate: 'починати' },
            { v1: 'break', v2: 'broke', v3: 'broken', translate: 'ламати' },
            { v1: 'bring', v2: 'brought', v3: 'brought', translate: 'приносити' },
            { v1: 'build', v2: 'built', v3: 'built', translate: 'будувати' },
            { v1: 'burn', v2: 'burnt', v3: 'burnt', translate: 'горіти, палити' },
            { v1: 'buy', v2: 'bought', v3: 'bought', translate: 'купувати' },
            { v1: 'catch', v2: 'caught', v3: 'caught', translate: 'ловити' },
            { v1: 'choose', v2: 'chose', v3: 'chosen', translate: 'вибирати' },
            { v1: 'come', v2: 'came', v3: 'come', translate: 'приходити' },
            { v1: 'cost', v2: 'cost', v3: 'cost', translate: 'коштувати' },
            { v1: 'cut', v2: 'cut', v3: 'cut', translate: 'різати' },
            { v1: 'do', v2: 'did', v3: 'done', translate: 'робити' },
            { v1: 'draw', v2: 'drew', v3: 'drawn', translate: 'малювати, тягти' },
            { v1: 'dream', v2: 'dreamt', v3: 'dreamt', translate: 'мріяти, снитися' },
            { v1: 'drink', v2: 'drank', v3: 'drunk', translate: 'пити' },
            { v1: 'drive', v2: 'drove', v3: 'driven', translate: 'водити (авто)' },
            { v1: 'eat', v2: 'ate', v3: 'eaten', translate: 'їсти' },
            { v1: 'fall', v2: 'fell', v3: 'fallen', translate: 'падати, опадати' },
            { v1: 'find', v2: 'found', v3: 'found', translate: 'знаходити' },
            { v1: 'fly', v2: 'flew', v3: 'flown', translate: 'літати' },
            { v1: 'forget', v2: 'forgot', v3: 'forgotten', translate: 'забувати' },
            { v1: 'get', v2: 'got', v3: 'got', translate: 'отримувати, ставати' },
            { v1: 'give', v2: 'gave', v3: 'given', translate: 'давати' },
            { v1: 'go', v2: 'went', v3: 'gone', translate: 'йти, їхати' },
            { v1: 'grow', v2: 'grew', v3: 'grown', translate: 'рости, вирощувати' },
            { v1: 'have', v2: 'had', v3: 'had', translate: 'мати' },
            { v1: 'hear', v2: 'heard', v3: 'heard', translate: 'чути' },
            { v1: 'hit', v2: 'hit', v3: 'hit', translate: 'вдаряти, влучати' },
            { v1: 'hold', v2: 'held', v3: 'held', translate: 'тримати' },
            { v1: 'hurt', v2: 'hurt', v3: 'hurt', translate: 'боліти, завдавати болю' },
            { v1: 'keep', v2: 'kept', v3: 'kept', translate: 'тримати, зберігати' },
            { v1: 'know', v2: 'knew', v3: 'known', translate: 'знати' },
            { v1: 'learn', v2: 'learnt', v3: 'learnt', translate: 'вчити(ся)' },
            { v1: 'leave', v2: 'left', v3: 'left', translate: 'залишати, покидати' },
            { v1: 'lend', v2: 'lent', v3: 'lent', translate: 'позичати' },
            { v1: 'lie', v2: 'lay', v3: 'lain', translate: 'лежати' },
            { v1: 'lose', v2: 'lost', v3: 'lost', translate: 'втрачати' },
            { v1: 'make', v2: 'made', v3: 'made', translate: 'робити' }
        ];

        const HangmanDrawing = ({ mistakes }) => {
            return (
                <svg className="hangman-svg mx-auto mb-4" viewBox="0 0 100 100">
                    {/* Виселица */}
                    <line x1="10" y1="95" x2="90" y2="95" stroke="#334155" strokeWidth="3" />
                    <line x1="30" y1="95" x2="30" y2="5" stroke="#334155" strokeWidth="3" />
                    <line x1="30" y1="5" x2="70" y2="5" stroke="#334155" strokeWidth="3" />
                    <line x1="70" y1="5" x2="70" y2="20" stroke="#334155" strokeWidth="3" />
                    
                    {/* Челик */}
                    {mistakes > 0 && <circle cx="70" cy="30" r="8" fill="none" stroke="#ef4444" strokeWidth="3" />} {/* Голова */}
                    {mistakes > 1 && <line x1="70" y1="38" x2="70" y2="65" stroke="#ef4444" strokeWidth="3" />} {/* Туловище */}
                    {mistakes > 2 && <line x1="70" y1="45" x2="55" y2="55" stroke="#ef4444" strokeWidth="3" />} {/* Л. Рука */}
                    {mistakes > 3 && <line x1="70" y1="45" x2="85" y2="55" stroke="#ef4444" strokeWidth="3" />} {/* П. Рука */}
                    {mistakes > 4 && <line x1="70" y1="65" x2="55" y2="85" stroke="#ef4444" strokeWidth="3" />} {/* Л. Нога */}
                    {mistakes > 5 && <line x1="70" y1="65" x2="85" y2="85" stroke="#ef4444" strokeWidth="3" />} {/* П. Нога */}
                </svg>
            );
        };

        function App() {
            const [mode, setMode] = useState('menu');
            const [xp, setXp] = useState(0);
            const [bestScore, setBestScore] = useState(0);
            const [currentVerbs, setCurrentVerbs] = useState([]);
            const [idx, setIdx] = useState(0);
            const [score, setScore] = useState(0);
            const [feedback, setFeedback] = useState(null);
            const [quizFinished, setQuizFinished] = useState(false);
            const [isFlipped, setIsFlipped] = useState(false);
            const [timeLeft, setTimeLeft] = useState(0);
            const [sprintItem, setSprintItem] = useState(null);
            const [options, setOptions] = useState([]);
            const [inputs, setInputs] = useState({ v2: '', v3: '' });
            const timerRef = useRef(null);

            const [hangmanWord, setHangmanWord] = useState('');
            const [guessedLetters, setGuessedLetters] = useState([]);
            const [wrongCount, setWrongCount] = useState(0);
            const maxMistakes = 6;

            const level = Math.floor(xp / 100) + 1;

            useEffect(() => {
                setXp(parseInt(localStorage.getItem('verb_xp')) || 0);
                setBestScore(parseInt(localStorage.getItem('bestScore')) || 0);
            }, []);

            const addXp = (amount) => {
                const newXp = xp + amount;
                setXp(newXp);
                localStorage.setItem('verb_xp', newXp);
            };

            const speakVerbSet = (verb) => {
                // Произносим 3 формы по очереди
                const text = `${verb.v1}, ${verb.v2}, ${verb.v3}`;
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-US';
                u.rate = 0.85;
                window.speechSynthesis.cancel(); // Сбрасываем старую очередь
                window.speechSynthesis.speak(u);
            };

            const shuffle = (a) => [...a].sort(() => Math.random() - 0.5);

            const startFlashcards = () => {
                setCurrentVerbs(shuffle(VERBS));
                setIdx(0); setIsFlipped(false); setMode('cards');
            };

            const startChoice = () => {
                const shuffled = shuffle(VERBS).slice(0, 20);
                setCurrentVerbs(shuffled);
                setIdx(0); setScore(0); setQuizFinished(false);
                setMode('choice');
                genOptions(shuffled[0]);
            };

            const genOptions = (correct) => {
                const right = `${correct.v2}, ${correct.v3}`;
                const wrongs = shuffle(VERBS.filter(v => v.v1 !== correct.v1))
                    .slice(0, 3)
                    .map(v => `${v.v2}, ${v.v3}`);
                setOptions(shuffle([right, ...wrongs]));
            };

            const startSprint = () => {
                setScore(0); setTimeLeft(60); setQuizFinished(false);
                setMode('sprint'); genSprint();
                timerRef.current = setInterval(() => setTimeLeft(p => {
                    if(p <= 1) { clearInterval(timerRef.current); return 0; }
                    return p - 1;
                }), 1000);
            };

            const genSprint = () => {
                const v = VERBS[Math.floor(Math.random()*VERBS.length)];
                const isOk = Math.random() > 0.5;
                const display = isOk ? `${v.v2} — ${v.v3}` : (() => {
                    const o = VERBS[Math.floor(Math.random()*VERBS.length)];
                    return `${o.v2} — ${o.v3}`;
                })();
                setSprintItem({ v, display, isOk });
            };

            const startWriting = () => {
                setCurrentVerbs(shuffle(VERBS).slice(0, 15));
                setIdx(0); setScore(0); setQuizFinished(false);
                setInputs({ v2: '', v3: '' }); setMode('writing');
            };

            const startHangman = () => {
                const shuffled = shuffle(VERBS);
                setCurrentVerbs(shuffled);
                setIdx(0); setScore(0); setQuizFinished(false);
                setMode('hangman');
                initHangman(shuffled[0]);
            };

            const initHangman = (verb) => {
                setHangmanWord(verb.v1.toLowerCase());
                setGuessedLetters([]);
                setWrongCount(0);
            };

            const handleHangmanGuess = (letter) => {
                if (guessedLetters.includes(letter) || wrongCount >= maxMistakes) return;
                const newGuessed = [...guessedLetters, letter];
                setGuessedLetters(newGuessed);

                if (!hangmanWord.includes(letter)) {
                    const newWrong = wrongCount + 1;
                    setWrongCount(newWrong);
                    if (newWrong >= maxMistakes) {
                        setFeedback('wrong');
                        setTimeout(() => {
                            setFeedback(null);
                            nextHangman();
                        }, 1500);
                    }
                } else {
                    if (hangmanWord.split('').every(l => newGuessed.includes(l))) {
                        setScore(s => s + 1);
                        setFeedback('correct');
                        addXp(15);
                        setTimeout(() => {
                            setFeedback(null);
                            nextHangman();
                        }, 1000);
                    }
                }
            };

            const nextHangman = () => {
                if (idx < currentVerbs.length - 1) {
                    const nextIdx = idx + 1;
                    setIdx(nextIdx);
                    initHangman(currentVerbs[nextIdx]);
                } else {
                    setQuizFinished(true);
                }
            };

            const handleChoice = (opt) => {
                const correct = `${currentVerbs[idx].v2}, ${currentVerbs[idx].v3}`;
                if(opt === correct) {
                    setScore(s => s + 1); setFeedback('correct'); addXp(10);
                    speakVerbSet(currentVerbs[idx]);
                } else setFeedback('wrong');

                setTimeout(() => {
                    setFeedback(null);
                    if(idx < currentVerbs.length - 1) {
                        setIdx(idx + 1); genOptions(currentVerbs[idx + 1]);
                    } else setQuizFinished(true);
                }, 800);
            };

            const handleSprint = (ans) => {
                if(ans === sprintItem.isOk) {
                    setScore(s => s + 1); setFeedback('correct'); addXp(5);
                } else setFeedback('wrong');
                setTimeout(() => {
                    setFeedback(null);
                    if(timeLeft > 0) genSprint(); else setQuizFinished(true);
                }, 200);
            };

            const handleWrite = () => {
                const v = currentVerbs[idx];
                const normalize = s => s.trim().toLowerCase();
                const check = (user, real) => real.split('/').some(r => normalize(r) === normalize(user));
                
                if(check(inputs.v2, v.v2) && check(inputs.v3, v.v3)) {
                    setScore(s => s + 1); setFeedback('correct'); addXp(25);
                    speakVerbSet(v);
                } else setFeedback('wrong');

                setTimeout(() => {
                    setFeedback(null); setInputs({ v2: '', v3: '' });
                    if(idx < currentVerbs.length - 1) setIdx(idx + 1);
                    else setQuizFinished(true);
                }, 1000);
            };

            const endSession = () => {
                if(score > bestScore) {
                    setBestScore(score);
                    localStorage.setItem('bestScore', score);
                }
                clearInterval(timerRef.current);
                setMode('menu'); setQuizFinished(false);
            };

            return (
                <div className={`min-h-screen transition-colors duration-300 ${feedback === 'correct' ? 'bg-green-100' : feedback === 'wrong' ? 'bg-red-100' : 'bg-[#F8FAFC]'}`}>
                    <div className="max-w-xl mx-auto px-4 py-8">
                        <header className="flex justify-between items-center mb-8">
                            <div className="cursor-pointer" onClick={endSession}>
                                <h1 className="text-2xl font-black tracking-tight text-indigo-600">VERB.IO</h1>
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Hardcore Edition</p>
                            </div>
                            <div className="flex gap-3">
                                <div className="glass px-4 py-2 rounded-2xl flex items-center gap-2 shadow-sm">
                                    <i className="fa-solid fa-fire text-orange-500"></i>
                                    <span className="font-extrabold text-sm">{bestScore}</span>
                                </div>
                                <div className="bg-indigo-600 text-white px-4 py-2 rounded-2xl flex items-center gap-2 shadow-lg">
                                    <i className="fa-solid fa-star text-yellow-300"></i>
                                    <span className="font-extrabold text-sm">LVL {level}</span>
                                </div>
                            </div>
                        </header>

                        {mode === 'menu' && (
                            <div className="grid grid-cols-1 gap-4">
                                <div className="bg-indigo-600 p-8 rounded-[2.5rem] shadow-2xl relative overflow-hidden group cursor-pointer" onClick={startFlashcards}>
                                    <div className="relative z-10">
                                        <h2 className="text-4xl font-extrabold text-white mb-2">Начать мясо</h2>
                                        <p className="text-indigo-100 text-sm font-medium opacity-80 mb-6">{VERBS.length} глаголов ждут тебя</p>
                                        <div className="flex items-center gap-2 text-white font-black text-sm uppercase">Вперёд <i className="fa-solid fa-arrow-right"></i></div>
                                    </div>
                                    <i className="fa-solid fa-skull-crossbones absolute -right-6 -bottom-6 text-[12rem] text-white opacity-10 rotate-12"></i>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <CardBtn icon="fa-clone" color="text-blue-500" label="Карточки" sub="Повторение" onClick={startFlashcards} />
                                    <CardBtn icon="fa-bolt" color="text-orange-500" label="Спринт" sub="Да / Нет" onClick={startSprint} />
                                    <CardBtn icon="fa-list-check" color="text-purple-500" label="Выбор" sub="4 варианта" onClick={startChoice} />
                                    <CardBtn icon="fa-pen-nib" color="text-emerald-500" label="Письмо" sub="Хардкор" onClick={startWriting} />
                                    <CardBtn icon="fa-skull" color="text-rose-500" label="Виселица" sub="Угадай V1" onClick={startHangman} />
                                </div>
                            </div>
                        )}

                        {!quizFinished && mode !== 'menu' && (
                            <div className="animate-in fade-in zoom-in duration-300">
                                <div className="flex justify-between items-center mb-6 bg-white p-3 rounded-2xl shadow-sm">
                                    <button onClick={endSession} className="w-10 h-10 rounded-xl hover:bg-slate-50 text-slate-400"><i className="fa-solid fa-house"></i></button>
                                    <div className="font-black text-slate-800">
                                        {mode === 'sprint' ? `${timeLeft}s` : `${idx + 1} / ${currentVerbs.length}`}
                                    </div>
                                    <div className="font-black text-indigo-600">Score: {score}</div>
                                </div>

                                {mode === 'cards' && (
                                    <div className="space-y-6">
                                        <div className={`flip-card w-full h-[400px] ${isFlipped ? 'flipped' : ''}`} onClick={() => {
                                            if(!isFlipped) speakVerbSet(currentVerbs[idx]);
                                            setIsFlipped(!isFlipped);
                                        }}>
                                            <div className="flip-card-inner">
                                                <div className="flip-card-front glass shadow-xl border-b-[12px] border-slate-200">
                                                    <h3 className="text-5xl font-black text-slate-800">{currentVerbs[idx]?.translate}</h3>
                                                    <div className="mt-8 text-slate-300 font-bold text-xs uppercase">Жми, чтобы открыть</div>
                                                </div>
                                                <div className="flip-card-back bg-indigo-600 text-white shadow-xl relative overflow-hidden">
                                                    <div className="space-y-1">
                                                        <div className="text-4xl font-black">{currentVerbs[idx]?.v1}</div>
                                                        <div className="text-4xl font-black opacity-80">{currentVerbs[idx]?.v2}</div>
                                                        <div className="text-4xl font-black opacity-60">{currentVerbs[idx]?.v3}</div>
                                                    </div>
                                                    <button onClick={(e) => { e.stopPropagation(); speakVerbSet(currentVerbs[idx]); }} className="mt-8 w-14 h-14 bg-white/20 rounded-full"><i className="fa-solid fa-volume-high"></i></button>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="flex gap-4">
                                            <button className="flex-1 h-16 rounded-2xl bg-white border-2 font-black" onClick={() => {setIsFlipped(false); setIdx(p => Math.max(0, p-1))}}>НАЗАД</button>
                                            <button className="flex-1 h-16 rounded-2xl bg-slate-900 text-white font-black" onClick={() => {setIsFlipped(false); setIdx(p => Math.min(currentVerbs.length-1, p+1))}}>ДАЛЕЕ</button>
                                        </div>
                                    </div>
                                )}

                                {mode === 'hangman' && (
                                    <div className="space-y-6 text-center">
                                        <div className="bg-white p-8 rounded-[3rem] shadow-xl">
                                            <HangmanDrawing mistakes={wrongCount} />
                                            <p className="text-slate-400 font-bold uppercase text-[10px] mb-2">{currentVerbs[idx].translate}</p>
                                            <div className="text-4xl font-black tracking-widest text-slate-800 uppercase mb-4">
                                                {hangmanWord.split('').map((l, i) => (
                                                    <span key={i} className="mx-1 border-b-4 border-slate-200 min-w-[25px] inline-block">
                                                        {guessedLetters.includes(l) ? l : ''}
                                                    </span>
                                                ))}
                                            </div>
                                            {wrongCount >= maxMistakes && <p className="text-rose-500 font-black">Было: {hangmanWord}</p>}
                                        </div>
                                        <div className="grid grid-cols-7 gap-1">
                                            {'abcdefghijklmnopqrstuvwxyz'.split('').map(l => (
                                                <button key={l} disabled={guessedLetters.includes(l)} onClick={() => handleHangmanGuess(l)}
                                                    className="letter-btn h-9 bg-white rounded-lg font-bold text-slate-700 shadow-sm uppercase text-xs"
                                                >{l}</button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {mode === 'choice' && (
                                    <div className="space-y-4">
                                        <div className="bg-white p-12 rounded-[3rem] shadow-xl text-center">
                                            <h2 className="text-5xl font-black text-slate-800">{currentVerbs[idx].v1}</h2>
                                            <p className="text-slate-400 font-bold uppercase text-[10px] mt-2">{currentVerbs[idx].translate}</p>
                                        </div>
                                        <div className="grid grid-cols-1 gap-3">
                                            {options.map((o, i) => (
                                                <button key={i} onClick={() => handleChoice(o)} className="bg-white p-6 rounded-2xl font-black text-slate-700 shadow-sm border-2 border-transparent hover:border-indigo-500 text-left flex justify-between items-center">
                                                    {o} <i className="fa-solid fa-chevron-right text-slate-200"></i>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {mode === 'sprint' && (
                                    <div className="space-y-6 text-center">
                                        <div className="bg-white p-16 rounded-[3rem] shadow-2xl">
                                            <h3 className="text-6xl font-black text-slate-800 mb-4">{sprintItem?.v.translate}</h3>
                                            <p className="text-3xl font-black text-indigo-600 bg-indigo-50 py-6 rounded-3xl">{sprintItem?.display}</p>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <button onClick={() => handleSprint(false)} className="h-24 rounded-[2.5rem] bg-white border-4 border-red-500 text-red-500 text-4xl"><i className="fa-solid fa-xmark"></i></button>
                                            <button onClick={() => handleSprint(true)} className="h-24 rounded-[2.5rem] bg-white border-4 border-green-500 text-green-500 text-4xl"><i className="fa-solid fa-check"></i></button>
                                        </div>
                                    </div>
                                )}

                                {mode === 'writing' && (
                                    <div className="space-y-4">
                                        <div className="bg-white p-10 rounded-[2.5rem] shadow-xl text-center">
                                            <h2 className="text-5xl font-black text-slate-800">{currentVerbs[idx].v1}</h2>
                                            <p className="text-slate-400 font-bold">{currentVerbs[idx].translate}</p>
                                        </div>
                                        <div className="space-y-3">
                                            <input value={inputs.v2} onChange={e => setInputs({...inputs, v2: e.target.value})} placeholder="V2 (Past Simple)" className="w-full h-16 px-6 rounded-2xl bg-white border-2 outline-none font-bold text-lg" />
                                            <input value={inputs.v3} onChange={e => setInputs({...inputs, v3: e.target.value})} placeholder="V3 (Past Participle)" className="w-full h-16 px-6 rounded-2xl bg-white border-2 outline-none font-bold text-lg" />
                                            <button onClick={handleWrite} className="w-full h-16 bg-slate-900 text-white rounded-2xl font-black text-xl shadow-xl">ПРОВЕРИТЬ</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {quizFinished && (
                            <div className="text-center animate-in zoom-in duration-500">
                                <div className="bg-white p-12 rounded-[3.5rem] shadow-2xl">
                                    <i className="fa-solid fa-trophy text-7xl text-yellow-400 mb-6"></i>
                                    <h2 className="text-4xl font-black text-slate-800">ГОТОВО!</h2>
                                    <div className="grid grid-cols-2 gap-4 my-8">
                                        <div className="bg-slate-50 p-6 rounded-3xl">
                                            <p className="text-[10px] font-black text-slate-300 uppercase">Счёт</p>
                                            <p className="text-3xl font-black">{score}</p>
                                        </div>
                                        <div className="bg-indigo-50 p-6 rounded-3xl">
                                            <p className="text-[10px] font-black text-indigo-300 uppercase">Опыт</p>
                                            <p className="text-3xl font-black text-indigo-600">+{score * 10}</p>
                                        </div>
                                    </div>
                                    <button onClick={endSession} className="w-full h-16 bg-indigo-600 text-white rounded-2xl font-black text-xl">В МЕНЮ</button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const CardBtn = ({ icon, color, label, sub, onClick }) => (
            <div onClick={onClick} className="bg-white p-6 rounded-[2rem] shadow-sm hover:shadow-xl cursor-pointer transition-all group">
                <div className={`${color} bg-current/10 w-12 h-12 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform`}>
                    <i className={`fa-solid ${icon} text-xl`}></i>
                </div>
                <h4 className="font-extrabold text-slate-800 text-sm uppercase">{label}</h4>
                <p className="text-[10px] text-slate-400 font-bold uppercase mt-1">{sub}</p>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
