<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irregular Verbs Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // Данные из твоих скриншотов
        const initialVerbsData = [
          { v1: 'be', v2: 'was, were', v3: 'been', translate: 'бути' },
          { v1: 'become', v2: 'became', v3: 'become', translate: 'ставати' },
          { v1: 'begin', v2: 'began', v3: 'begun', translate: 'починати' },
          { v1: 'break', v2: 'broke', v3: 'broken', translate: 'ламати' },
          { v1: 'bring', v2: 'brought', v3: 'brought', translate: 'приносити' },
          { v1: 'build', v2: 'built', v3: 'built', translate: 'будувати' },
          { v1: 'burn', v2: 'burnt / burned', v3: 'burnt / burned', translate: 'горіти, палити' },
          { v1: 'buy', v2: 'bought', v3: 'bought', translate: 'купувати' },
          { v1: 'catch', v2: 'caught', v3: 'caught', translate: 'ловити' },
          { v1: 'choose', v2: 'chose', v3: 'chosen', translate: 'вибирати' },
          { v1: 'come', v2: 'came', v3: 'come', translate: 'приходити' },
          { v1: 'cost', v2: 'cost', v3: 'cost', translate: 'коштувати' },
          { v1: 'cut', v2: 'cut', v3: 'cut', translate: 'різати' },
          { v1: 'do', v2: 'did', v3: 'done', translate: 'робити' },
          { v1: 'draw', v2: 'drew', v3: 'drawn', translate: 'малювати, тягти' },
          { v1: 'dream', v2: 'dreamed / dreamt', v3: 'dreamed / dreamt', translate: 'мріяти, снитися' },
          { v1: 'drink', v2: 'drank', v3: 'drunk', translate: 'пити' },
          { v1: 'drive', v2: 'drove', v3: 'driven', translate: 'водити (авто)' },
          { v1: 'eat', v2: 'ate', v3: 'eaten', translate: 'їсти' },
          { v1: 'fall', v2: 'fell', v3: 'fallen', translate: 'падати, опадати' },
          { v1: 'find', v2: 'found', v3: 'found', translate: 'знаходити' },
          { v1: 'fly', v2: 'flew', v3: 'flown', translate: 'літати' },
          { v1: 'forget', v2: 'forgot', v3: 'forgotten', translate: 'забувати' },
          { v1: 'get', v2: 'got', v3: 'got', translate: 'отримувати, ставати' },
          { v1: 'give', v2: 'gave', v3: 'given', translate: 'давати' },
          { v1: 'go', v2: 'went', v3: 'gone / been', translate: 'йти, їхати' },
          { v1: 'grow', v2: 'grew', v3: 'grown', translate: 'рости, вирощувати' },
          { v1: 'have', v2: 'had', v3: 'had', translate: 'мати' },
          { v1: 'hear', v2: 'heard', v3: 'heard', translate: 'чути' },
          { v1: 'hit', v2: 'hit', v3: 'hit', translate: 'вдаряти, влучати' },
          { v1: 'hold', v2: 'held', v3: 'held', translate: 'тримати' },
          { v1: 'hurt', v2: 'hurt', v3: 'hurt', translate: 'боліти, завдавати болю' },
          { v1: 'keep', v2: 'kept', v3: 'kept', translate: 'тримати, зберігати' },
          { v1: 'know', v2: 'knew', v3: 'known', translate: 'знати' },
          { v1: 'learn', v2: 'learned / learnt', v3: 'learned / learnt', translate: 'вчити(ся)' },
          { v1: 'leave', v2: 'left', v3: 'left', translate: 'залишати, покидати' },
          { v1: 'lend', v2: 'lent', v3: 'lent', translate: 'позичати' },
          { v1: 'lie', v2: 'lay', v3: 'lain', translate: 'лежати' },
          { v1: 'lose', v2: 'lost', v3: 'lost', translate: 'втрачати' },
          { v1: 'make', v2: 'made', v3: 'made', translate: 'робити' }
        ];

        function App() {
            const [bestScore, setBestScore] = useState(0);
            const [totalSessions, setTotalSessions] = useState(0);
            const [mode, setMode] = useState('menu');
            const [score, setScore] = useState(0);
            const [timeLeft, setTimeLeft] = useState(60);
            const [feedback, setFeedback] = useState(null);
            const [sprintPair, setSprintPair] = useState({ verb: null, shownForms: '', isCorrect: false });
            const [quizFinished, setQuizFinished] = useState(false);
            const timerRef = useRef(null);

            // Локальная база данных (будет сохранять рекорды даже после перезагрузки!)
            useEffect(() => {
                const savedBest = localStorage.getItem('bestScore');
                const savedSessions = localStorage.getItem('totalSessions');
                if (savedBest) setBestScore(parseInt(savedBest));
                if (savedSessions) setTotalSessions(parseInt(savedSessions));
            }, []);

            const updateStats = (newScore) => {
                const newBest = Math.max(bestScore, newScore);
                const newSessions = totalSessions + 1;
                setBestScore(newBest);
                setTotalSessions(newSessions);
                localStorage.setItem('bestScore', newBest);
                localStorage.setItem('totalSessions', newSessions);
            };

            const verbOfTheDay = useMemo(() => {
                return initialVerbsData[Math.floor(Math.random() * initialVerbsData.length)];
            }, []);

            const speak = (text) => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            };

            const generateSprintPair = () => {
                const randomVerb = initialVerbsData[Math.floor(Math.random() * initialVerbsData.length)];
                const isCorrect = Math.random() > 0.5;
                let shownForms = isCorrect ? `${randomVerb.v2} — ${randomVerb.v3}` : 
                  (() => {
                    const other = initialVerbsData[Math.floor(Math.random() * initialVerbsData.length)];
                    return `${other.v2} — ${other.v3}`;
                  })();
                setSprintPair({ verb: randomVerb, shownForms, isCorrect });
            };

            const startSprint = () => {
                setScore(0);
                setTimeLeft(60);
                setQuizFinished(false);
                setMode('sprint');
                generateSprintPair();
                
                timerRef.current = setInterval(() => {
                  setTimeLeft((prev) => {
                    if (prev <= 1) {
                      clearInterval(timerRef.current);
                      return 0;
                    }
                    return prev - 1;
                  });
                }, 1000);
            };

            useEffect(() => {
                if (timeLeft === 0 && mode === 'sprint' && !quizFinished) {
                    setQuizFinished(true);
                    updateStats(score);
                }
            }, [timeLeft]);

            const handleSprintAnswer = (answer) => {
                let currentScore = score;
                if (answer === sprintPair.isCorrect) {
                  currentScore = score + 1;
                  setScore(currentScore);
                  setFeedback('correct');
                } else {
                  setFeedback('wrong');
                }
                setTimeout(() => {
                  setFeedback(null);
                  if (timeLeft > 0) generateSprintPair();
                  else {
                    setQuizFinished(true);
                    updateStats(currentScore);
                  }
                }, 200);
            };

            const resetToMenu = () => {
                clearInterval(timerRef.current);
                setMode('menu');
                setQuizFinished(false);
                setFeedback(null);
            };

            return (
                <div className={`min-h-screen p-4 flex flex-col items-center transition-colors duration-200 ${feedback === 'correct' ? 'bg-green-500' : feedback === 'wrong' ? 'bg-red-500' : 'bg-slate-50'}`}>
                    <div className="w-full max-w-xl mt-6">
                        <header className="flex justify-between items-center mb-8">
                           <div>
                              <h1 className={`text-2xl font-black ${feedback ? 'text-white' : 'text-slate-900'}`}>Irregular Verbs</h1>
                              <p className={`text-[10px] font-bold uppercase tracking-widest ${feedback ? 'text-white/60' : 'text-slate-400'}`}>База данных активна</p>
                           </div>
                           {bestScore > 0 && (
                             <div className="bg-white/20 backdrop-blur-md px-4 py-2 rounded-2xl border border-white/30 text-white font-bold text-sm flex items-center gap-2 shadow-sm">
                                <i className="fa-solid fa-trophy text-yellow-300"></i> Рекорд: {bestScore}
                             </div>
                           )}
                        </header>

                        {mode === 'menu' && (
                          <div className="space-y-4">
                            <div className="bg-indigo-600 text-white rounded-[2rem] border-none shadow-xl overflow-hidden p-6">
                               <div className="flex justify-between items-start mb-4">
                                  <span className="text-[10px] font-black uppercase tracking-widest bg-black/20 px-3 py-1 rounded-full">Слово дня</span>
                                  <i className="fa-solid fa-lightbulb text-yellow-300"></i>
                               </div>
                               <h2 className="text-4xl font-black mb-1">{verbOfTheDay.v1}</h2>
                               <p className="opacity-80 italic font-medium mb-4">{verbOfTheDay.v2} / {verbOfTheDay.v3}</p>
                               <div className="flex justify-between items-center">
                                  <p className="font-bold">{verbOfTheDay.translate}</p>
                                  <button className="p-3 rounded-full bg-white/10 hover:bg-white/20 transition" onClick={() => speak(verbOfTheDay.v1)}>
                                      <i className="fa-solid fa-volume-high"></i>
                                  </button>
                               </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                               <div className="p-6 rounded-[2rem] border-2 border-transparent hover:border-slate-200 bg-white shadow-sm cursor-pointer text-center group" onClick={startSprint}>
                                  <i className="fa-solid fa-bolt text-orange-500 text-3xl mb-2 group-hover:scale-110 transition"></i>
                                  <span className="font-black text-slate-800 uppercase text-xs block">Быстрый Спринт</span>
                               </div>
                               <div className="p-6 rounded-[2rem] bg-white border border-slate-100 text-center">
                                  <p className="text-[9px] font-black text-slate-400 uppercase mb-1">Всего сессий</p>
                                  <p className="text-xl font-black text-slate-800">{totalSessions}</p>
                               </div>
                            </div>
                          </div>
                        )}

                        {mode === 'sprint' && !quizFinished && (
                          <div className="space-y-6 text-center">
                             <div className="flex justify-between items-center bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                                <button className="text-slate-600 hover:text-slate-900 font-bold" onClick={resetToMenu}><i className="fa-solid fa-house mr-2"></i> Меню</button>
                                <div className="text-2xl font-black text-orange-500 flex items-center gap-2"><i className="fa-solid fa-bolt"></i> {timeLeft}s</div>
                                <div className="font-black text-slate-400">Score: {score}</div>
                             </div>

                             <div className="p-12 rounded-[3rem] shadow-2xl bg-white border-b-8 border-orange-100">
                                <p className="text-slate-300 font-black uppercase text-xs mb-2 italic">{sprintPair.verb?.v1}</p>
                                <h3 className="text-5xl font-black text-slate-800 mb-8">{sprintPair.verb?.translate}</h3>
                                <div className="h-px bg-slate-100 w-24 mx-auto mb-8"></div>
                                <p className="text-3xl font-black text-indigo-600">{sprintPair.shownForms}</p>
                             </div>

                             <div className="grid grid-cols-2 gap-4">
                                <button className="h-20 rounded-3xl text-2xl font-black bg-red-500 hover:bg-red-600 text-white shadow-xl flex items-center justify-center disabled:opacity-50" onClick={() => handleSprintAnswer(false)} disabled={feedback !== null}>
                                    <i className="fa-solid fa-xmark text-3xl"></i>
                                </button>
                                <button className="h-20 rounded-3xl text-2xl font-black bg-green-500 hover:bg-green-600 text-white shadow-xl flex items-center justify-center disabled:opacity-50" onClick={() => handleSprintAnswer(true)} disabled={feedback !== null}>
                                    <i className="fa-solid fa-check text-3xl"></i>
                                </button>
                             </div>
                          </div>
                        )}

                        {quizFinished && (
                           <div className="p-12 text-center rounded-[3rem] shadow-2xl bg-white border-t-8 border-green-400">
                              <i className="fa-solid fa-circle-check text-green-500 text-7xl mb-6"></i>
                              <h2 className="text-4xl font-black text-slate-800 mb-2">ГОТОВО!</h2>
                              <p className="text-slate-400 font-bold uppercase tracking-widest text-xs mb-8">Твой результат</p>
                              <div className="text-8xl font-black text-slate-800 mb-10">{score}</div>
                              <button className="w-full h-16 rounded-2xl bg-slate-900 text-white font-bold text-xl hover:bg-slate-800 transition" onClick={resetToMenu}>ВЕРНУТЬСЯ В МЕНЮ</button>
                           </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
